syntax = "proto3";

package agent.v1;

option go_package = "github.com/anrted/opendeploy/proto/agent/v1;agentv1";

// ControlPlane is the single long-lived, Agent-initiated connection used for
// remote management. The first AgentMessage must contain hello.
service ControlPlane {
    rpc Connect(stream AgentMessage) returns (stream CoreMessage);
}

message AgentMessage {
    oneof body {
        AgentHello hello = 1;
        AgentHeartbeat heartbeat = 2;
        CommandResult command_result = 3;
        TaskProgress task_progress = 4;
        AgentEvent event = 5;
        StreamChunk chunk = 6;
        StreamError error = 7;
        Pong pong = 8;
    }
}

message CoreMessage {
    oneof body {
        StreamWelcome welcome = 1;
        AgentCommand command = 2;
        StreamSubscription subscribe = 3;
        StreamCancel cancel = 4;
        StreamError error = 5;
        Ping ping = 6;
    }
}

message AgentHello {
    string server_id = 1;
    string certificate_fingerprint = 2;
    uint32 protocol_version = 3;
    string api_version = 4;
    string agent_version = 5;
    repeated string capabilities = 6;
}

message StreamWelcome {
    string connection_id = 1;
    uint32 protocol_version = 2;
    int32 heartbeat_interval_seconds = 3;
    int64 server_time_unix_ms = 4;
}

message AgentHeartbeat {
    double cpu_usage = 1;
    double memory_usage = 2;
    double disk_usage = 3;
    uint64 network_rx = 4;
    uint64 network_tx = 5;
    double load_1 = 6;
    double load_5 = 7;
    double load_15 = 8;
    int64 uptime = 9;
    string health = 10;
    uint32 running_tasks = 11;
    int64 sent_at_unix_ms = 12;
}

message AgentCommand {
    string id = 1;
    string kind = 2;
    bytes payload = 3;
    int64 deadline_unix_ms = 4;
    bool asynchronous = 5;
}

message CommandResult {
    string id = 1;
    bool success = 2;
    bytes payload = 3;
    string error = 4;
}

message TaskProgress {
    string task_id = 1;
    uint32 percent = 2;
    string state = 3;
    string message = 4;
    bytes result = 5;
}

message AgentEvent {
    string type = 1;
    string severity = 2;
    bytes payload = 3;
    int64 occurred_at_unix_ms = 4;
}

message StreamSubscription {
    string id = 1;
    string kind = 2;
    bytes payload = 3;
}

message StreamChunk {
    string stream_id = 1;
    uint64 sequence = 2;
    bytes data = 3;
    bool eof = 4;
}

message StreamCancel { string id = 1; }
message StreamError { string id = 1; string code = 2; string message = 3; }
message Ping { int64 sent_at_unix_ms = 1; }
message Pong { int64 sent_at_unix_ms = 1; }

// AgentService is the gRPC service exposed by the OpenDeploy Agent.
// The Core calls these methods to perform privileged system operations.
// The Agent validates every request against an allowlist before execution.
service AgentService {
    // ── Systemd service management ─────────────────────────────────────────
    rpc ServiceAction (ServiceActionRequest) returns (ServiceActionResponse);
    rpc ServiceStatus (ServiceStatusRequest) returns (ServiceStatusResponse);
    rpc ServiceLogs   (ServiceLogsRequest)   returns (stream LogLine);
    rpc ServiceStreamLogs (ServiceStreamLogsRequest) returns (stream LogLine);
    rpc FileLogs      (FileLogsRequest)      returns (stream LogLine);
    rpc StreamLogs    (StreamLogsRequest)    returns (stream LogLine);
    rpc CommandExecute(CommandExecuteRequest) returns (CommandExecuteResponse);

    // ── Package management ─────────────────────────────────────────────────
    rpc PackageInstall (PackageRequest)       returns (stream PackageOutput);
    rpc PackageRemove  (PackageRequest)       returns (stream PackageOutput);
    rpc PackageUpdate  (PackageRequest)       returns (stream PackageOutput);
    rpc PackageStatus  (PackageRequest)       returns (PackageStatusResponse);

    // ── File system ────────────────────────────────────────────────────────
    rpc FileRead   (FileReadRequest)   returns (FileReadResponse);
    rpc FileWrite  (FileWriteRequest)  returns (FileWriteResponse);
    rpc FileDelete (FileDeleteRequest) returns (FileDeleteResponse);
    rpc DirCreate  (DirCreateRequest)  returns (DirCreateResponse);
    rpc DirList    (DirListRequest)    returns (DirListResponse);
    rpc FileRename (FileRenameRequest) returns (FileRenameResponse);
    rpc FileCopy   (FileCopyRequest)   returns (FileCopyResponse);
    rpc FileChmod  (FileChmodRequest)  returns (FileChmodResponse);
    rpc FileChown  (FileChownRequest)  returns (FileChownResponse);
    rpc ArchiveCreate  (ArchiveCreateRequest)  returns (ArchiveCreateResponse);
    rpc ArchiveExtract (ArchiveExtractRequest) returns (ArchiveExtractResponse);
    rpc FileUploadStream (stream FileUploadRequest) returns (FileUploadResponse);

    // Typed Nginx site configuration. The Agent renders, validates and applies
    // the configuration atomically; Core cannot execute arbitrary commands.
    rpc NginxSiteApply (NginxSiteApplyRequest) returns (NginxSiteApplyResponse);

    // ── Firewall ───────────────────────────────────────────────────────────
    rpc FirewallRule (FirewallRuleRequest) returns (FirewallRuleResponse);
    rpc FirewallDelete (FirewallDeleteRequest) returns (FirewallDeleteResponse);
    rpc FirewallList (FirewallListRequest) returns (FirewallListResponse);
    rpc FirewallStatus (FirewallStatusRequest) returns (FirewallStatusResponse);
    rpc FirewallToggle (FirewallToggleRequest) returns (FirewallToggleResponse);
    rpc FirewallReset (FirewallResetRequest) returns (FirewallResetResponse);

    // ── Cron management ──────────────────────────────────────────────────
    rpc CronList (CronListRequest) returns (CronListResponse);
    rpc CronGet (CronGetRequest) returns (CronJob);
    rpc CronCreate (CronMutationRequest) returns (CronJob);
    rpc CronUpdate (CronMutationRequest) returns (CronJob);
    rpc CronDelete (CronIDRequest) returns (CronOperationResponse);
    rpc CronEnable (CronIDRequest) returns (CronJob);
    rpc CronDisable (CronIDRequest) returns (CronJob);
    rpc CronRun (CronRunRequest) returns (CronRunRecord);
    rpc CronHistory (CronHistoryRequest) returns (CronHistoryResponse);
    rpc CronLogs (CronLogsRequest) returns (CronHistoryResponse);
    rpc CronImport (CronImportRequest) returns (CronListResponse);
    rpc CronExport (CronExportRequest) returns (CronExportResponse);
    rpc CronValidate (CronMutationRequest) returns (CronValidationResponse);

    // ── System information ─────────────────────────────────────────────────
    rpc SystemStats (SystemStatsRequest) returns (SystemStatsResponse);
    rpc ProcessList (ProcessListRequest) returns (ProcessListResponse);
    rpc ProcessKill (ProcessKillRequest) returns (ProcessKillResponse);

    // ── Health check ───────────────────────────────────────────────────────
    rpc Ping (PingRequest) returns (PingResponse);
}

// ─── Service management ────────────────────────────────────────────────────

enum ServiceActionType {
    SERVICE_ACTION_UNSPECIFIED = 0;
    SERVICE_ACTION_START       = 1;
    SERVICE_ACTION_STOP        = 2;
    SERVICE_ACTION_RESTART     = 3;
    SERVICE_ACTION_ENABLE      = 4;
    SERVICE_ACTION_DISABLE     = 5;
    SERVICE_ACTION_RELOAD      = 6;
}

message ServiceActionRequest {
    string            service_name = 1;
    ServiceActionType action       = 2;
}

message ServiceActionResponse {
    bool   success = 1;
    string message = 2;
}

message ServiceStatusRequest {
    string service_name = 1;
}

message ServiceStatusResponse {
    string name        = 1;
    bool   active      = 2;
    bool   enabled     = 3;
    string sub_state   = 4;
    string description = 5;
}

message ServiceLogsRequest {
    string service_name = 1;
    int32  lines        = 2;
}

message LogLine {
    string line      = 1;
    int64  timestamp = 2; // Unix nanoseconds
}

message FileLogsRequest {
    string path  = 1;
    int32  lines = 2;
}

message StreamLogsRequest {
    string path  = 1;
}

message ServiceStreamLogsRequest {
    string service_name = 1;
}

message CommandExecuteRequest {
    string   command = 1;
    repeated string args = 2;
}

message CommandExecuteResponse {
    int32  exit_code = 1;
    string stdout    = 2;
    string stderr    = 3;
}

// ─── Package management ────────────────────────────────────────────────────

message PackageRequest {
    string package_name = 1;
}

message PackageOutput {
    string line   = 1;
    bool   is_err = 2; // true if stderr
}

message PackageStatusResponse {
    bool   installed = 1;
    string version   = 2;
}

// ─── File system ───────────────────────────────────────────────────────────

message FileReadRequest {
    string path = 1;
}

message FileReadResponse {
    bytes content = 1;
}

message FileWriteRequest {
    string path    = 1;
    bytes  content = 2;
    uint32 mode    = 3; // unix permission bits (e.g. 0644)
}

message FileWriteResponse {
    bool success = 1;
}

message FileDeleteRequest {
    string path = 1;
}

message FileDeleteResponse {
    bool success = 1;
}

message DirCreateRequest {
    string path = 1;
    uint32 mode = 2;
}

message DirCreateResponse {
    bool success = 1;
}

message DirListRequest {
    string path = 1;
}

message DirListResponse {
    repeated FileEntry entries = 1;
}

message FileEntry {
    string name     = 1;
    string path     = 2;
    bool   is_dir   = 3;
    int64  size     = 4;
    uint32 mode     = 5;
    int64  mod_time = 6; // Unix seconds
    string owner    = 7;
    string group    = 8;
}

message FileRenameRequest {
    string old_path = 1;
    string new_path = 2;
}
message FileRenameResponse {
    bool success = 1;
}

message FileCopyRequest {
    string src_path = 1;
    string dst_path = 2;
}
message FileCopyResponse {
    bool success = 1;
}

message FileChmodRequest {
    string path = 1;
    uint32 mode = 2;
}
message FileChmodResponse {
    bool success = 1;
}

message FileChownRequest {
    string path = 1;
    int32  uid  = 2;
    int32  gid  = 3;
}
message FileChownResponse {
    bool success = 1;
}

message ArchiveCreateRequest {
    repeated string paths    = 1;
    string          dst_path = 2;
}
message ArchiveCreateResponse {
    bool success = 1;
}

message ArchiveExtractRequest {
    string src_path = 1;
    string dst_dir  = 2;
}
message ArchiveExtractResponse {
    bool success = 1;
}

message FileUploadRequest {
    string path    = 1; // Only required on first message
    uint32 mode    = 2; // Only required on first message
    bytes  chunk   = 3;
}
message FileUploadResponse {
    bool success = 1;
}

enum NginxSiteAction {
    NGINX_SITE_ACTION_UNSPECIFIED = 0;
    NGINX_SITE_ACTION_UPSERT      = 1;
    NGINX_SITE_ACTION_DELETE      = 2;
    NGINX_SITE_ACTION_ENABLE      = 3;
    NGINX_SITE_ACTION_DISABLE     = 4;
}

message NginxSiteApplyRequest {
    NginxSiteAction action      = 1;
    string          domain      = 2;
    string          root_path   = 3;
    string          php_version = 4;
    bool            ssl_enabled = 5;
    string          ssl_cert    = 6;
    string          ssl_key     = 7;
}

message NginxSiteApplyResponse {
    bool   success = 1;
    string message = 2;
}

// ─── Firewall ──────────────────────────────────────────────────────────────

enum FirewallAction {
    FIREWALL_ACTION_UNSPECIFIED = 0;
    FIREWALL_ACTION_ALLOW       = 1;
    FIREWALL_ACTION_DENY        = 2;
    FIREWALL_ACTION_REJECT      = 3;
}

enum FirewallDirection {
    FIREWALL_DIRECTION_UNSPECIFIED = 0;
    FIREWALL_DIRECTION_IN          = 1;
    FIREWALL_DIRECTION_OUT         = 2;
    FIREWALL_DIRECTION_ROUTED      = 3;
}

enum FirewallIPVersion {
    FIREWALL_IP_VERSION_UNSPECIFIED = 0;
    FIREWALL_IP_VERSION_V4          = 1;
    FIREWALL_IP_VERSION_V6          = 2;
    FIREWALL_IP_VERSION_BOTH        = 3;
}

message FirewallRuleRequest {
    string            id          = 1; // Used for update
    string            port        = 2; // e.g. "80", "8000:8100", or empty for any
    string            protocol    = 3; // "tcp", "udp", "any"
    FirewallAction    action      = 4;
    FirewallDirection direction   = 5;
    string            source      = 6; // IP or subnet, empty for any
    string            destination = 7; // IP or subnet, empty for any
    string            comment     = 8;
    FirewallIPVersion ip_version  = 9;
}

message FirewallRuleResponse {
    bool   success = 1;
    string message = 2;
}

message FirewallDeleteRequest {
    string id = 1;
}

message FirewallDeleteResponse {
    bool   success = 1;
    string message = 2;
}

message FirewallListRequest {}

message FirewallListResponse {
    repeated FirewallEntry rules = 1;
}

message FirewallEntry {
    string            id          = 1;
    string            port        = 2;
    string            protocol    = 3;
    FirewallAction    action      = 4;
    FirewallDirection direction   = 5;
    string            source      = 6;
    string            destination = 7;
    string            comment     = 8;
    FirewallIPVersion ip_version  = 9;
}

message FirewallStatusRequest {}

message FirewallStatusResponse {
    bool   active           = 1;
    string default_incoming = 2;
    string default_outgoing = 3;
    string default_routed   = 4;
    bool   ipv6_enabled     = 5;
    string logging          = 6;
    int32  rule_count       = 7;
    string profile_name     = 8; // e.g., "ufw"
}

message FirewallToggleRequest {
    bool enable = 1;
}

message FirewallToggleResponse {
    bool   success = 1;
    string message = 2;
}

message FirewallResetRequest {}

message FirewallResetResponse {
    bool   success = 1;
    string message = 2;
}

// ─── Cron management ─────────────────────────────────────────────────────

enum CronJobType {
    CRON_JOB_TYPE_UNKNOWN = 0;
    CRON_JOB_TYPE_SYSTEM = 1;
    CRON_JOB_TYPE_PACKAGE = 2;
    CRON_JOB_TYPE_OPENDEPLOY = 3;
    CRON_JOB_TYPE_USER = 4;
}

message CronJob {
    string id = 1;
    string name = 2;
    string description = 3;
    string command = 4;
    string working_dir = 5;
    string user = 6;
    map<string, string> environment = 7;
    string expression = 8;
    string timezone = 9;
    bool enabled = 10;
    int64 created_at = 11;
    int64 updated_at = 12;
    string source = 13;
    bool read_only = 14;
    CronJobType type = 15;
    string package_name = 16;
    bool is_protected = 17;
    bool can_edit = 18;
    bool can_delete = 19;
    string lock_reason = 20;
}

message CronListRequest {}
message CronListResponse { repeated CronJob jobs = 1; }
message CronGetRequest { string id = 1; }
message CronIDRequest { string id = 1; }
message CronMutationRequest { CronJob job = 1; }
message CronOperationResponse { bool success = 1; }
message CronRunRequest {
    string id = 1;
    string trigger = 2;
    string actor = 3;
}
message CronRunRecord {
    string id = 1;
    string job_id = 2;
    int64 started_at = 3;
    int64 finished_at = 4;
    int64 duration_ms = 5;
    int32 exit_code = 6;
    string stdout = 7;
    string stderr = 8;
    string triggered = 9;
    string actor = 10;
}
message CronHistoryRequest {
    string id = 1;
    int32 limit = 2;
}
message CronLogsRequest {
    string id = 1;
    int32 limit = 2;
}
message CronHistoryResponse { repeated CronRunRecord runs = 1; }
message CronImportRequest {
    string format = 1;
    bytes content = 2;
    bool replace = 3;
}
message CronExportRequest { string format = 1; }
message CronExportResponse {
    string format = 1;
    bytes content = 2;
}
message CronValidationResponse {
    bool valid = 1;
    repeated string warnings = 2;
    string error = 3;
}

// ─── System information ────────────────────────────────────────────────────

message SystemStatsRequest {}

message SystemStatsResponse {
    double cpu_usage_percent    = 1;
    int32  cpu_cores            = 2;
    uint64 memory_total         = 3;
    uint64 memory_used          = 4;
    uint64 memory_free          = 5;
    uint64 swap_total           = 6;
    uint64 swap_used            = 7;
    repeated DiskStatEntry disk = 8;
    uint64 net_bytes_sent       = 9;
    uint64 net_bytes_recv       = 10;
    double load_1               = 11;
    double load_5               = 12;
    double load_15              = 13;
    double temperature          = 14;
    int64  uptime               = 15;
}

message DiskStatEntry {
    string mountpoint    = 1;
    uint64 total         = 2;
    uint64 used          = 3;
    uint64 free          = 4;
    double used_percent  = 5;
}

// ─── Ping ──────────────────────────────────────────────────────────────────

message PingRequest {}

message PingResponse {
    string version = 1;
}

// ─── Process management ────────────────────────────────────────────────────

message ProcessListRequest {}

message ProcessListResponse {
    repeated ProcessEntry processes = 1;
}

message ProcessEntry {
    int32  pid          = 1;
    int32  ppid         = 2;
    string name         = 3;
    string user         = 4;
    double cpu_percent  = 5;
    double mem_percent  = 6;
    uint64 mem_rss      = 7;
    int32  num_threads  = 8;
    int64  create_time  = 9; // Unix milliseconds
    string cmdline      = 10;
}

message ProcessKillRequest {
    int32 pid   = 1;
    bool  force = 2; // if true use SIGKILL, else SIGTERM
}

message ProcessKillResponse {
    bool   success = 1;
    string message = 2;
}
