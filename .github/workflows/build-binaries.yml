name: Build Binaries

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
        description: "Version string to inject into the binary (e.g., nightly, v1.0.0)"
      release_tag:
        required: false
        type: string
        description: "Tag name for the release (e.g., nightly, v1.0.0)"
      generate_release_notes:
        required: false
        type: boolean
        default: false
      prerelease:
        required: false
        type: boolean
        default: false

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Frontend
        run: |
          cd web
          npm ci
          npm run build
          cd ..
          rm -rf internal/core/webui/dist
          mkdir -p internal/core/webui/dist
          cp -R web/dist/. internal/core/webui/dist/

      - name: Build Binaries (amd64)
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 1
        run: |
          mkdir -p build-amd64
          LDFLAGS="-s -w -X github.com/anrted/opendeploy/pkg/version.Version=${{ inputs.version }} -X github.com/anrted/opendeploy/pkg/version.Commit=${GITHUB_SHA} -X github.com/anrted/opendeploy/pkg/version.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -ldflags "$LDFLAGS" -o build-amd64/opendeploy-core ./cmd/core
          go build -ldflags "$LDFLAGS" -o build-amd64/opendeploy-agent ./cmd/agent
          go build -ldflags "$LDFLAGS" -o build-amd64/opendeploy-cli ./cmd/cli
          tar -czvf opendeploy-linux-amd64.tar.gz -C build-amd64 opendeploy-core opendeploy-agent opendeploy-cli

      - name: Install ARM64 cross-compiler
        run: sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build Binaries (arm64)
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 1
          CC: aarch64-linux-gnu-gcc
        run: |
          mkdir -p build-arm64
          LDFLAGS="-s -w -X github.com/anrted/opendeploy/pkg/version.Version=${{ inputs.version }} -X github.com/anrted/opendeploy/pkg/version.Commit=${GITHUB_SHA} -X github.com/anrted/opendeploy/pkg/version.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -ldflags "$LDFLAGS" -o build-arm64/opendeploy-core ./cmd/core
          go build -ldflags "$LDFLAGS" -o build-arm64/opendeploy-agent ./cmd/agent
          go build -ldflags "$LDFLAGS" -o build-arm64/opendeploy-cli ./cmd/cli
          tar -czvf opendeploy-linux-arm64.tar.gz -C build-arm64 opendeploy-core opendeploy-agent opendeploy-cli

      - name: Generate Checksums
        run: |
          sha256sum opendeploy-linux-amd64.tar.gz opendeploy-linux-arm64.tar.gz > checksums.txt

      - name: Generate release manifest
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          jq -n \
            --arg schema "opendeploy.release/v1" \
            --arg version "$RELEASE_VERSION" \
            --arg commit "$GITHUB_SHA" \
            --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg amd64_sha "$(sha256sum opendeploy-linux-amd64.tar.gz | cut -d' ' -f1)" \
            --argjson amd64_size "$(stat -c%s opendeploy-linux-amd64.tar.gz)" \
            --arg arm64_sha "$(sha256sum opendeploy-linux-arm64.tar.gz | cut -d' ' -f1)" \
            --argjson arm64_size "$(stat -c%s opendeploy-linux-arm64.tar.gz)" \
            '{
              schema: $schema,
              version: $version,
              tag: $version,
              commit: $commit,
              published_at: $published_at,
              artifacts: [
                {os:"linux", arch:"amd64", name:"opendeploy-linux-amd64.tar.gz", sha256:$amd64_sha, size:$amd64_size},
                {os:"linux", arch:"arm64", name:"opendeploy-linux-arm64.tar.gz", sha256:$arm64_sha, size:$arm64_size}
              ]
            }' > release-manifest.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.2

      - name: Sign release manifest with GitHub OIDC
        run: cosign sign-blob --yes --bundle release-manifest.json.bundle release-manifest.json

      - name: Create GitHub Release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Release ${{ inputs.release_tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: ${{ inputs.generate_release_notes }}
          files: |
            opendeploy-linux-amd64.tar.gz
            opendeploy-linux-arm64.tar.gz
            checksums.txt
            release-manifest.json
            release-manifest.json.bundle
