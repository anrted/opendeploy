name: Build Binaries

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
        description: "Version string to inject into the binary (e.g., nightly, v1.0.0)"
      release_tag:
        required: false
        type: string
        description: "Tag name for the release (e.g., nightly, v1.0.0)"
      generate_release_notes:
        required: false
        type: boolean
        default: false
      prerelease:
        required: false
        type: boolean
        default: false

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Frontend
        run: |
          cd web
          npm ci
          npm run build
          cd ..
          rm -rf internal/core/webui/dist
          mkdir -p internal/core/webui/dist
          cp -R web/dist/. internal/core/webui/dist/

      - name: Build Binaries (amd64)
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 1
        run: |
          mkdir -p build-amd64
          go build -ldflags "-s -w -X github.com/anrted/opendeploy/pkg/version.Version=${{ inputs.version }}" -o build-amd64/opendeploy-core ./cmd/core
          go build -ldflags "-s -w -X github.com/anrted/opendeploy/pkg/version.Version=${{ inputs.version }}" -o build-amd64/opendeploy-agent ./cmd/agent
          go build -ldflags "-s -w -X github.com/anrted/opendeploy/pkg/version.Version=${{ inputs.version }}" -o build-amd64/opendeploy-cli ./cmd/cli
          tar -czvf opendeploy-linux-amd64.tar.gz -C build-amd64 opendeploy-core opendeploy-agent opendeploy-cli

      - name: Build Binaries (arm64)
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          mkdir -p build-arm64
          go build -ldflags "-s -w -X github.com/anrted/opendeploy/pkg/version.Version=${{ inputs.version }}" -o build-arm64/opendeploy-core ./cmd/core
          go build -ldflags "-s -w -X github.com/anrted/opendeploy/pkg/version.Version=${{ inputs.version }}" -o build-arm64/opendeploy-agent ./cmd/agent
          go build -ldflags "-s -w -X github.com/anrted/opendeploy/pkg/version.Version=${{ inputs.version }}" -o build-arm64/opendeploy-cli ./cmd/cli
          tar -czvf opendeploy-linux-arm64.tar.gz -C build-arm64 opendeploy-core opendeploy-agent opendeploy-cli

      - name: Generate Checksums
        run: |
          sha256sum opendeploy-linux-amd64.tar.gz opendeploy-linux-arm64.tar.gz > checksums.txt

      - name: Create GitHub Release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Release ${{ inputs.release_tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: ${{ inputs.generate_release_notes }}
          files: |
            opendeploy-linux-amd64.tar.gz
            opendeploy-linux-arm64.tar.gz
            checksums.txt
