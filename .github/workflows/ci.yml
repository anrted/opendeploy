name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
      - name: Create dummy dist for embed
        run: |
          mkdir -p internal/core/webui/dist
          printf '<!doctype html><html><body><div id="app"></div></body></html>\n' > internal/core/webui/dist/index.html
      - name: Install and run golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run ./... --timeout=5m --new-from-rev=HEAD~1

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
      - name: Create dummy dist for embed
        run: |
          mkdir -p internal/core/webui/dist
          printf '<!doctype html><html><body><div id="app"></div></body></html>\n' > internal/core/webui/dist/index.html
      - run: go test -v -race ./...

  lint-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx eslint . --max-warnings 0

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
      
      - name: Create dummy dist for embed
        run: |
          mkdir -p internal/core/webui/dist
          printf '<!doctype html><html><body><div id="app"></div></body></html>\n' > internal/core/webui/dist/index.html
      - name: Run Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
          
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
          
      - name: Run NPM Audit
        run: |
          cd web
          npm audit || true # Using true to not fail CI immediately on audit for now
