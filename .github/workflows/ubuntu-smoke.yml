name: Ubuntu smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-and-provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install system dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y fail2ban nginx nodejs
          sudo systemctl enable --now nginx
      - name: Build and install
        run: |
          make build
          sudo sh deployments/install-dev.sh
      - name: Start services
        run: |
          echo "OD_ADMIN_PASSWORD=SmokeTestPassword123!" | sudo tee -a /etc/opendeploy/env
          sudo systemctl start opendeploy-agent
          sudo systemctl start opendeploy-core
          timeout 30 sh -c 'until curl -fsS http://127.0.0.1:5888/health; do sleep 1; done'
      - name: Login and provision Nginx site
        run: |
          password=$(sudo sed -n 's/^OD_ADMIN_PASSWORD=//p' /etc/opendeploy/env)
          cookie_jar=$(mktemp)
          trap 'rm -f "$cookie_jar"' EXIT
          csrf_token=$(curl -fsS -c "$cookie_jar" -D - \
            http://127.0.0.1:5888/api/v1/auth/csrf -o /dev/null |
            awk 'tolower($1) == "x-csrf-token:" { sub(/\r$/, "", $2); print $2 }')
          test -n "$csrf_token"
          token=$(curl -fsS http://127.0.0.1:5888/api/v1/auth/login \
            -b "$cookie_jar" \
            -H "X-CSRF-Token: $csrf_token" \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$password\"}" | jq -r .access_token)
          test -n "$token"
          enrollment=$(curl --fail-with-body -sS -X POST \
            http://127.0.0.1:5888/api/v1/servers \
            -b "$cookie_jar" \
            -H "X-CSRF-Token: $csrf_token" \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d '{"name":"Smoke remote agent","description":"CI registration check","tags":["smoke"]}')
          registration_token=$(printf '%s' "$enrollment" | jq -er .registration_token)
          server_id=$(printf '%s' "$enrollment" | jq -er .server.id)
          openssl ecparam -genkey -name prime256v1 -noout -out /tmp/opendeploy-smoke-agent.key
          openssl req -new -key /tmp/opendeploy-smoke-agent.key \
            -subj '/CN=smoke-remote-agent' -out /tmp/opendeploy-smoke-agent.csr
          registration_payload=$(jq -n \
            --arg token "$registration_token" \
            --rawfile csr /tmp/opendeploy-smoke-agent.csr \
            '{token:$token,csr:$csr,hostname:"smoke-remote-agent",machine_id:"ci-smoke",agent_version:"0.1.23",os:"linux",distribution:"ubuntu",os_version:"24.04",kernel:"ci",architecture:"amd64",cpu_model:"CI",cpu_cores:2,ram_total:1073741824,disk_total:10737418240,private_ip:"127.0.0.1"}')
          registration=$(curl --fail-with-body -sS -X POST \
            http://127.0.0.1:5888/api/v1/agents/register \
            -H 'Content-Type: application/json' \
            -d "$registration_payload")
          fingerprint=$(printf '%s' "$registration" | jq -er .fingerprint)
          test "$(printf '%s' "$registration" | jq -er .server_id)" = "$server_id"
          curl --fail-with-body -sS -X POST \
            http://127.0.0.1:5888/api/v1/agents/heartbeat \
            -H "X-OpenDeploy-Agent-ID: $server_id" \
            -H "X-OpenDeploy-Cert-Fingerprint: $fingerprint" \
            -H 'Content-Type: application/json' \
            -d '{"state":"online","cpu_usage":12.5,"memory_usage":34.5,"disk_usage":45.5,"uptime":120,"agent_version":"0.1.23"}' |
            jq -e '.heartbeat_interval > 0'
          curl --fail-with-body -sS \
            "http://127.0.0.1:5888/api/v1/servers?query=Smoke%20remote%20agent" \
            -H "Authorization: Bearer $token" |
            jq -e --arg id "$server_id" '.items[] | select(.id == $id and .status == "online")'
          curl -fsS http://127.0.0.1:5888/api/v1/modules \
            -H "Authorization: Bearer $token" |
            jq -e '.[] | select(.id == "nodejs" and (.state == "installed" or .state == "enabled"))'
          for preset in sshd nginx_scanners nginx_auth nginx_bad_bots php_probes; do
            curl --fail-with-body -sS -X POST \
              "http://127.0.0.1:5888/api/v1/modules/fail2ban/actions/enable_preset_${preset}" \
              -H "Authorization: Bearer $token"
          done
          sudo fail2ban-client status opendeploy-sshd
          sudo fail2ban-client status opendeploy-nginx-scanners
          sudo fail2ban-client status opendeploy-nginx-auth
          sudo fail2ban-client status opendeploy-nginx-bad-bots
          sudo fail2ban-client status opendeploy-php-probes
          sudo systemctl is-active --quiet opendeploy-update.path
          sudo test -s /etc/opendeploy/source-dir
          sudo install -d -o www-data -g www-data /var/www/smoke
          echo smoke | sudo tee /var/www/smoke/index.html >/dev/null
          curl --fail-with-body -sS http://127.0.0.1:5888/api/v1/sites \
            -b "$cookie_jar" \
            -H "X-CSRF-Token: $csrf_token" \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d '{"domain":"smoke.local","root_path":"/var/www/smoke","module_id":"nginx"}'
          timeout 15 sh -c \
            'until curl -fsS -H "Host: smoke.local" http://127.0.0.1/ | grep -q smoke; do sleep 1; done'
          sudo nginx -t
      - name: Reboot-equivalent restart
        run: |
          sudo systemctl restart opendeploy-agent opendeploy-core
          timeout 30 sh -c 'until curl -fsS http://127.0.0.1:5888/health; do sleep 1; done'
          curl -fsS -H 'Host: smoke.local' http://127.0.0.1/ | grep smoke
      - name: Collect service logs on failure
        if: failure()
        run: |
          sudo systemctl status opendeploy-agent opendeploy-core opendeploy-update.path --no-pager || true
          sudo journalctl -u opendeploy-agent -u opendeploy-core -u opendeploy-update.service --no-pager || true
