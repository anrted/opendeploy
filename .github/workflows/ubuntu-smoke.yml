name: Ubuntu smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-and-provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install system dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y fail2ban nginx nodejs
          sudo systemctl enable --now nginx
      - name: Build and install
        run: |
          make build
          sudo sh deployments/install-dev.sh
      - name: Start services
        run: |
          echo "OD_ADMIN_PASSWORD=SmokeTestPassword123!" | sudo tee -a /etc/opendeploy/env
          sudo systemctl start opendeploy-agent
          sudo systemctl start opendeploy-core
          timeout 30 sh -c 'until curl -fsS http://127.0.0.1:5888/health; do sleep 1; done'
      - name: Login and provision Nginx site
        run: |
          password=$(sudo sed -n 's/^OD_ADMIN_PASSWORD=//p' /etc/opendeploy/env)
          cookie_jar=$(mktemp)
          trap 'rm -f "$cookie_jar"' EXIT
          csrf_token=$(curl -fsS -c "$cookie_jar" -D - \
            http://127.0.0.1:5888/api/v1/auth/csrf -o /dev/null |
            awk 'tolower($1) == "x-csrf-token:" { sub(/\r$/, "", $2); print $2 }')
          test -n "$csrf_token"
          token=$(curl -fsS http://127.0.0.1:5888/api/v1/auth/login \
            -b "$cookie_jar" \
            -H "X-CSRF-Token: $csrf_token" \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$password\"}" | jq -r .access_token)
          test -n "$token"
          curl -fsS http://127.0.0.1:5888/api/v1/modules \
            -H "Authorization: Bearer $token" |
            jq -e '.[] | select(.id == "nodejs" and (.state == "installed" or .state == "enabled"))'
          for preset in sshd nginx_scanners nginx_auth php_probes; do
            curl --fail-with-body -sS -X POST \
              "http://127.0.0.1:5888/api/v1/modules/fail2ban/actions/enable_preset_${preset}" \
              -H "Authorization: Bearer $token"
          done
          sudo fail2ban-client status opendeploy-sshd
          sudo fail2ban-client status opendeploy-nginx-scanners
          sudo fail2ban-client status opendeploy-nginx-auth
          sudo fail2ban-client status opendeploy-php-probes
          sudo systemctl is-active --quiet opendeploy-update.path
          sudo test -s /etc/opendeploy/source-dir
          sudo install -d -o www-data -g www-data /var/www/smoke
          echo smoke | sudo tee /var/www/smoke/index.html >/dev/null
          curl --fail-with-body -sS http://127.0.0.1:5888/api/v1/sites \
            -b "$cookie_jar" \
            -H "X-CSRF-Token: $csrf_token" \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d '{"domain":"smoke.local","root_path":"/var/www/smoke","module_id":"nginx"}'
          timeout 15 sh -c \
            'until curl -fsS -H "Host: smoke.local" http://127.0.0.1/ | grep -q smoke; do sleep 1; done'
          sudo nginx -t
      - name: Reboot-equivalent restart
        run: |
          sudo systemctl restart opendeploy-agent opendeploy-core
          timeout 30 sh -c 'until curl -fsS http://127.0.0.1:5888/health; do sleep 1; done'
          curl -fsS -H 'Host: smoke.local' http://127.0.0.1/ | grep smoke
      - name: Collect service logs on failure
        if: failure()
        run: |
          sudo systemctl status opendeploy-agent opendeploy-core opendeploy-update.path --no-pager || true
          sudo journalctl -u opendeploy-agent -u opendeploy-core -u opendeploy-update.service --no-pager || true
