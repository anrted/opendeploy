name: Nightly Build

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release Nightly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd web
          npm ci
          npm run build
          cd ..
          rm -rf internal/core/webui/dist
          mkdir -p internal/core/webui/dist
          cp -R web/dist/. internal/core/webui/dist/

      - name: Build Binaries (amd64)
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 1
        run: |
          mkdir -p build-amd64
          go build -ldflags "-s -w -X github.com/anrted/opendeploy/pkg/version.Version=nightly" -o build-amd64/opendeploy-core ./cmd/core
          go build -ldflags "-s -w -X github.com/anrted/opendeploy/pkg/version.Version=nightly" -o build-amd64/opendeploy-agent ./cmd/agent
          go build -ldflags "-s -w -X github.com/anrted/opendeploy/pkg/version.Version=nightly" -o build-amd64/opendeploy-cli ./cmd/cli
          tar -czvf opendeploy-linux-amd64.tar.gz -C build-amd64 opendeploy-core opendeploy-agent opendeploy-cli

      - name: Build Binaries (arm64)
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          mkdir -p build-arm64
          go build -ldflags "-s -w -X github.com/anrted/opendeploy/pkg/version.Version=nightly" -o build-arm64/opendeploy-core ./cmd/core
          go build -ldflags "-s -w -X github.com/anrted/opendeploy/pkg/version.Version=nightly" -o build-arm64/opendeploy-agent ./cmd/agent
          go build -ldflags "-s -w -X github.com/anrted/opendeploy/pkg/version.Version=nightly" -o build-arm64/opendeploy-cli ./cmd/cli
          tar -czvf opendeploy-linux-arm64.tar.gz -C build-arm64 opendeploy-core opendeploy-agent opendeploy-cli

      - name: Generate Checksums
        run: |
          sha256sum opendeploy-linux-amd64.tar.gz opendeploy-linux-arm64.tar.gz > checksums.txt

      - name: Create Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          files: |
            opendeploy-linux-amd64.tar.gz
            opendeploy-linux-arm64.tar.gz
            checksums.txt
          generate_release_notes: false
