## OpenDeploy Configuration
## Copy to /etc/opendeploy/opendeploy.yaml and edit before first run.

server:
  host: "0.0.0.0"
  port: 5888
  # Remote Agent control plane. PKI is generated automatically on first start.
  control_plane_enabled: true
  control_plane_port: 5889
  control_plane_server_name: "opendeploy-control-plane"
  control_plane_ca: "/var/lib/opendeploy/pki/ca.crt"
  control_plane_ca_key: "/var/lib/opendeploy/pki/ca.key"
  tls_certificate: "/var/lib/opendeploy/pki/control-plane.crt"
  tls_private_key: "/var/lib/opendeploy/pki/control-plane.key"
  read_timeout: 30s
  write_timeout: 60s

database:
  driver: "sqlite"
  dsn: "/var/lib/opendeploy/data.db"

agent:
  # Unix socket path. Must match the Agent configuration.
  socket: "/run/opendeploy-agent/agent.sock"
  timeout: 120s
  # Remote Agent only: outbound mTLS-compatible control-plane endpoint.
  control_plane_address: ""
  control_plane_ca_file: ""
  control_plane_server_name: ""

auth:
  # REQUIRED in production: set a 32+ character random string.
  # Alternatively, export OD_JWT_SECRET environment variable.
  # If empty, an ephemeral secret is generated (sessions reset on restart).
  jwt_secret: ""
  access_token_ttl: 15m
  refresh_token_ttl: 168h  # 7 days

security:
  rate_limit:
    enabled: true
    requests_per_minute: 300
  csrf:
    enabled: true

logging:
  level: "info"     # debug | info | warn | error
  format: "json"    # json | text
  file: "/var/log/opendeploy/core.log"

modules:
  enabled:
    - nginx
    - php
    - nodejs
    - git
